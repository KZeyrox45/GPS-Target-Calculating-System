[project]
name = "gps-tracking-backend"
version = "2.0.0"
description = "Real-Time Moving Target Tracking System - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.34.0",
    "websockets==14.2",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pydantic==2.13.4",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest==8.4.1",
    "pytest-asyncio==0.26.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
