services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gps-tracking-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gps-tracking-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
      - WS_URL=ws://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
